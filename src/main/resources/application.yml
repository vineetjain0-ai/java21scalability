spring:
  batch:
    job:
      enabled: false   # the job is started by TradeFileLauncher
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer

trade:
  input-dir: input
  topic: trades
  max-threads: 8       # max files processed at the same time, one virtual thread each (bounds memory)
  chunk-size: 1000     # lines read, processed and published together; only this many trades per thread are in memory
